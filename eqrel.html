<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equation Relationship Visualizer · LatticeLab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { navy: '#0f172a', crimson: '#991b1b', electron: '#0284c7' },
          fontFamily: {
            sans: ['IBM Plex Sans', 'system-ui', 'sans-serif'],
            serif: ['IBM Plex Serif', 'Georgia', 'serif'],
            mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/eqrel.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body class="font-sans antialiased">
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-24 left-1/4 h-72 w-72 rounded-full bg-electron/10 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 h-80 w-80 rounded-full bg-emerald-500/10 blur-3xl"></div>
    <div class="absolute bottom-10 left-0 h-64 w-64 rounded-full bg-crimson/10 blur-3xl"></div>
  </div>

  <header class="relative z-10 border-b border-sky-400/10">
    <div class="mx-auto flex max-w-[1680px] flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-5">
      <div class="flex flex-wrap items-center gap-3">
        <a href="index.html" class="back-btn inline-flex items-center gap-2 rounded-xl border border-sky-400/20 bg-slate-900/50 px-3 py-2 text-xs font-semibold text-sky-100">
          <i class="fa-solid fa-arrow-left"></i> Catalog
        </a>
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-violet-300/80">ESE 2180 · equation network</p>
          <h1 class="text-lg font-bold tracking-tight text-white sm:text-xl">Equation Relationship Visualizer</h1>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <label class="sr-only" for="eq-mat">Material</label>
        <select id="eq-mat" class="eq-select"></select>
        <div class="eq-toggle" role="group" aria-label="Explanation depth">
          <button type="button" data-depth="simple" class="eq-chip">Simple</button>
          <button type="button" data-depth="course" class="eq-chip is-on">Course</button>
          <button type="button" data-depth="deep" class="eq-chip">Deep</button>
        </div>
        <div class="eq-toggle" role="group" aria-label="View">
          <button type="button" data-view="physical" class="eq-chip">Physical</button>
          <button type="button" data-view="math" class="eq-chip">Math</button>
          <button type="button" data-view="both" class="eq-chip is-on">Both</button>
        </div>
        <button type="button" id="eq-units" class="eq-chip">Show units</button>
      </div>
    </div>
  </header>

  <div id="eq-app" class="eq-app relative z-10" data-mode="map" data-view="both">
    <nav class="eq-modes px-4 sm:px-5">
      <button type="button" data-eqmode="map" class="eq-chip is-on">Equation map</button>
      <button type="button" data-eqmode="variable" class="eq-chip">Explore by variable</button>
      <button type="button" data-eqmode="compare" class="eq-chip">Compare variables</button>
      <button type="button" data-eqmode="path" class="eq-chip">I know this → I need this</button>
      <button type="button" data-eqmode="changes" class="eq-chip">What changes what?</button>
      <button type="button" id="eq-drive-dop" class="eq-chip is-on">Drive: doping</button>
      <button type="button" id="eq-drive-ef" class="eq-chip">Drive: EF</button>
    </nav>

    <aside class="eq-left">
      <label class="eq-k" for="eq-search">Browser</label>
      <input id="eq-search" type="search" placeholder="Equation or variable" class="eq-search" />
      <div id="eq-browser" class="eq-browser"></div>
    </aside>

    <section class="eq-center">
      <div class="eq-map-wrap">
        <svg id="eq-map" class="eq-map" role="img" aria-label="Equation relationship map"></svg>
      </div>
      <div id="eq-viz" class="eq-viz"></div>
    </section>

    <aside class="eq-right" id="eq-explain"></aside>

    <section class="eq-bottom">
      <div class="eq-sliders">
        <label>T <strong id="lv-T">300 K</strong><input id="sl-T" type="range" /></label>
        <label>NA <strong id="lv-NA">1e15</strong><input id="sl-NA" type="range" /></label>
        <label>ND <strong id="lv-ND">1e16</strong><input id="sl-ND" type="range" /></label>
        <label>λ <strong id="lv-lam">1000 nm</strong><input id="sl-lambda" type="range" /></label>
        <label>E <strong id="lv-E">100 V/cm</strong><input id="sl-Efield" type="range" /></label>
      </div>
      <div id="eq-readout" class="eq-readout"></div>
      <div id="eq-hold" class="eq-hold"></div>
      <div id="eq-causal" class="eq-causal"></div>
      <div id="eq-tools" class="eq-tools"></div>
    </section>
  </div>

  <script type="module" src="js/eqrel/studio.js"></script>
</body>
</html>
